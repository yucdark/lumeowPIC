<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumeow PIC</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:28px 18px 60px;
  font-family:
    -apple-system,BlinkMacSystemFont,
    "Segoe UI","Microsoft YaHei",sans-serif;
  background:#f6f4f2;
  color:#282523;
}

.wrap{
  width:min(1100px,100%);
  margin:0 auto;
}

.top{
  margin-bottom:28px;
}

h1{
  margin:0;
  font-size:28px;
  font-weight:700;
}

.sub{
  margin-top:8px;
  color:#817a74;
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:18px;
}

.card{
  overflow:hidden;
  background:#fff;
  border:1px solid #e5dfda;
  border-radius:14px;
  box-shadow:0 6px 20px rgba(50,40,30,.06);
}

.preview{
  width:100%;
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eeeae6;
  overflow:hidden;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.info{
  padding:12px;
}

.name{
  font-size:12px;
  line-height:1.5;
  word-break:break-all;
  margin-bottom:10px;
}

.path{
  margin-bottom:10px;
  color:#99918a;
  font-size:10px;
  word-break:break-all;
}

.actions{
  display:flex;
  gap:7px;
}

button{
  flex:1;
  border:1px solid #d8d0ca;
  background:#faf8f6;
  color:#4b4540;
  border-radius:8px;
  padding:8px 6px;
  cursor:pointer;
  font-size:11px;
}

button:hover{
  background:#eee8e3;
}

.empty{
  color:#8e8680;
  padding:50px 0;
}

.toast{
  position:fixed;
  left:50%;
  bottom:28px;
  transform:translateX(-50%) translateY(20px);
  padding:9px 16px;
  border-radius:999px;
  background:#272321;
  color:#fff;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(max-width:520px){
  body{
    padding:20px 12px 50px;
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .info{
    padding:9px;
  }

  .actions{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <h1>Lumeow PIC</h1>
    <div class="sub">
      GitHub Pages 图片外链管理
    </div>
  </div>

  <div id="grid" class="grid"></div>
  <div id="empty" class="empty">正在读取图片……</div>

</div>

<div id="toast" class="toast">已复制</div>

<script>

const owner = "yucdark";
const repo = "lumeowPIC";
const branch = "main";

const base =
  `https://${owner}.github.io/${repo}/`;

const api =
  `https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`;

const imageExt =
  /\.(png|jpg|jpeg|webp|gif|avif)$/i;

const grid =
  document.getElementById("grid");

const empty =
  document.getElementById("empty");

const toast =
  document.getElementById("toast");


function imageUrl(path){
  return base + path
    .split("/")
    .map(encodeURIComponent)
    .join("/");
}


function showToast(text){
  toast.textContent = text;
  toast.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(()=>{
      toast.classList.remove("show");
    },1200);
}


async function copyText(text){
  await navigator.clipboard.writeText(text);
  showToast("已复制");
}


async function loadImages(){

  try{

    const res = await fetch(api);

    if(!res.ok){
      throw new Error("GitHub API Error");
    }

    const data = await res.json();

    const files = data.tree
      .filter(item =>
        item.type === "blob" &&
        imageExt.test(item.path)
      )
      .reverse();

    empty.style.display =
      files.length ? "none" : "block";

    if(!files.length){
      empty.textContent = "仓库里还没有图片";
      return;
    }


    files.forEach(file => {

      const url = imageUrl(file.path);

      const card =
        document.createElement("div");

      card.className = "card";


      const preview =
        document.createElement("div");

      preview.className = "preview";


      const img =
        document.createElement("img");

      img.src = url;
      img.loading = "lazy";
      img.alt = file.path;


      const info =
        document.createElement("div");

      info.className = "info";


      const name =
        document.createElement("div");

      name.className = "name";
      name.textContent =
        file.path.split("/").pop();


      const path =
        document.createElement("div");

      path.className = "path";
      path.textContent = file.path;


      const actions =
        document.createElement("div");

      actions.className = "actions";


      const linkBtn =
        document.createElement("button");

      linkBtn.textContent = "复制外链";

      linkBtn.onclick = () =>
        copyText(url);


      const cssBtn =
        document.createElement("button");

      cssBtn.textContent = "复制 CSS";

      cssBtn.onclick = () =>
        copyText(`url("${url}")`);


      preview.appendChild(img);

      actions.append(
        linkBtn,
        cssBtn
      );

      info.append(
        name,
        path,
        actions
      );

      card.append(
        preview,
        info
      );

      grid.appendChild(card);

    });

  }catch(error){

    empty.textContent =
      "图片读取失败，请稍后刷新。";

    console.error(error);

  }

}

loadImages();

</script>

</body>
</html>
